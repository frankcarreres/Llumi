name: Build & Deploy Frontend

on:
  push:
    branches:
      - uat   # o la rama que tú elijas
    paths:
      - 'frontend/**'
      
# Esta sección fuerza que solo un run por rama esté activo a la vez;
# los demás quedan en cola hasta que el anterior termine.
concurrency:
  group: deploy-frontend-${{ github.ref }}
  cancel-in-progress: false
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '20'

    - name: Install & Build
      working-directory: frontend
      run: |
        npm ci
        npm run build

    - name: Configure SSH
      run: |
        mkdir -p ~/.ssh
        # Obtiene la huella pública directamente del host
        ssh-keyscan -t rsa,ed25519,ecdsa ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

        # Escribe tu clave privada PEM EXACTA
        cat << 'EOF' > ~/.ssh/id_rsa
        ${{ secrets.EC2_SSH_KEY }}
        EOF
        chmod 600 ~/.ssh/id_rsa

    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes -v ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "echo SSH OK"

    - name: Sync build to EC2
      run: |
        rsync -avz --delete frontend/build/ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/
      env:
        RSYNC_RSH: "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes"

    - name: Reload Nginx on EC2
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=yes ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
          "sudo systemctl reload nginx"
